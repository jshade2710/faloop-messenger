name: Validate

# Guard rail: pluginmaster.json MUST stay a valid Dalamud custom-repo manifest
# (a JSON ARRAY of plugin objects with the required keys). We shipped a bug
# once where a JSON round-trip collapsed the single-element array into a bare
# object and broke installs — this check makes that class of mistake
# impossible to merge or release.

on:
  push:
    branches: [main]
    paths: ['pluginmaster.json']
  pull_request:
    paths: ['pluginmaster.json']
  workflow_call:        # reused by release.yml as a fail-fast pre-flight

env:
  # GitHub is deprecating Node 20 actions (forced to Node 24 on 2026-06-02,
  # removed 2026-09-16). This opts every JavaScript action onto Node 24 now;
  # it becomes a harmless no-op once Node 24 is the runner default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pluginmaster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate pluginmaster.json
        shell: pwsh
        run: |
          $path = 'pluginmaster.json'
          if (-not (Test-Path $path)) { Write-Error "$path is missing"; exit 1 }

          $raw = Get-Content $path -Raw

          # Authoritative array check: assert the JSON *literal* is a top-level
          # array, the way Dalamud actually parses it. (PowerShell's
          # ConvertFrom-Json collapses a single-element array to a bare object
          # on the pipeline, so a type check on the parsed value is unreliable —
          # that's the very gotcha this guard exists to catch.)
          if ($raw.TrimStart()[0] -ne '[') {
            Write-Error "pluginmaster.json must be a JSON ARRAY (literal must start with '[')"
            exit 1
          }

          try {
            # -NoEnumerate keeps a single-element array as an array.
            $json = $raw | ConvertFrom-Json -NoEnumerate
          } catch {
            Write-Error "pluginmaster.json is not valid JSON: $_"
            exit 1
          }

          $arr = @($json)
          if ($arr.Count -lt 1) {
            Write-Error "pluginmaster.json array is empty"
            exit 1
          }

          $required = @(
            'Author','Name','InternalName','AssemblyVersion','RepoUrl',
            'IconUrl','DownloadLinkInstall','DownloadLinkTesting','DownloadLinkUpdate'
          )

          $i = 0
          foreach ($entry in $arr) {
            foreach ($key in $required) {
              $val = $entry.$key
              if ($null -eq $val -or "$val".Trim() -eq '') {
                Write-Error "Entry[$i] is missing or has an empty '$key'"
                exit 1
              }
            }
            # Version must be 4-part (Dalamud requires AssemblyVersion x.y.z.w).
            if ($entry.AssemblyVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') {
              Write-Error "Entry[$i] AssemblyVersion '$($entry.AssemblyVersion)' is not x.y.z.w"
              exit 1
            }
            $i++
          }

          Write-Host "pluginmaster.json OK — array of $($arr.Count) entry(s), all required keys present."
